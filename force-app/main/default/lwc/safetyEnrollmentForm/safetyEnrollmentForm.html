<template>
    <div class={rootClass}>
        <template if:false={embedMode}>
            <c-acp-site-nav active-page="enroll"></c-acp-site-nav>
        </template>

        <section class={pageClass}>
            <div class="layout">
                <aside class="visual" aria-hidden="true">
                    <img src={sideImage} alt="" />
                    <div class="visual-shade"></div>
                    <div class="visual-copy">
                        <p class="eyebrow">PLUS RESCUER</p>
                        <h2>{visualTitle}</h2>
                        <p>{visualCopy}</p>
                    </div>
                </aside>

                <section class="form-shell">
                    <header class="intro">
                        <h2>{introTitle}</h2>
                        <p>{introCopy}</p>
                    </header>

                    <template if:true={isComplete}>
                        <div class="success" role="status">
                            <template if:true={isInquiryMode}>
                                <p>
                                    Thanks - your class inquiry is in. We’ll review what you shared and follow up with
                                    the best class option and how to enroll on the current schedule.
                                </p>
                            </template>
                            <template if:true={isSeatMode}>
                                <p>
                                    Thanks - your registration for <strong>{result.className}</strong> is in. Seat reserved
                                    <template if:true={result.agency}> under {result.agency}</template>.
                                </p>
                                <template if:true={result.confirmationCode}>
                                    <p class="code-block">
                                        Student access code:
                                        <strong>{result.confirmationCode}</strong>
                                    </p>
                                </template>
                                <template if:true={result.paymentLink}>
                                    <p>
                                        Complete payment here:
                                        <a href={result.paymentLink} target="_blank" rel="noopener noreferrer"
                                            >QuickBooks payment link</a
                                        >
                                    </p>
                                </template>
                                <template if:false={result.paymentLink}>
                                    <p>We’ll email your QuickBooks payment link shortly.</p>
                                </template>
                            </template>
                        </div>
                    </template>

                    <template if:false={isComplete}>
                        <!-- Inquiry mode: qualify which class is needed -->
                        <template if:true={isInquiryMode}>
                            <form class="form" onsubmit={handleSubmit}>
                                <p class="help-lead">
                                    Prefer to self-serve? Open the
                                    <a href="https://allcareplus.enrollware.com/calendar" target="_blank" rel="noopener noreferrer"
                                        >class calendar</a
                                    >
                                    (Pacific Time). After you register, return here for next steps. Or leave contact
                                    details and we’ll recommend a class.
                                </p>
                                <label>
                                    <span>First name</span>
                                    <input
                                        type="text"
                                        name="firstName"
                                        required
                                        value={inquiry.firstName}
                                        onchange={handleText}
                                    />
                                </label>
                                <label>
                                    <span>Last name</span>
                                    <input
                                        type="text"
                                        name="lastName"
                                        required
                                        value={inquiry.lastName}
                                        onchange={handleText}
                                    />
                                </label>
                                <label>
                                    <span>Email</span>
                                    <input type="email" name="email" required value={inquiry.email} onchange={handleText} />
                                </label>
                                <label>
                                    <span>Phone</span>
                                    <input type="tel" name="phone" required value={inquiry.phone} onchange={handleText} />
                                </label>
                                <label>
                                    <span>Organization (optional)</span>
                                    <input
                                        type="text"
                                        name="organization"
                                        value={inquiry.organization}
                                        onchange={handleText}
                                    />
                                </label>
                                <label>
                                    <span>Title (optional)</span>
                                    <input type="text" name="title" value={inquiry.title} onchange={handleText} />
                                </label>
                                <label class="full">
                                    <span>Which class? (optional — or Not sure)</span>
                                    <select name="classPick" value={inquiry.classPick} onchange={handleText}>
                                        <option value="">Not sure — please recommend</option>
                                        <option value="Basic Life Support (BLS)">Basic Life Support (BLS)</option>
                                        <option value="Adult & Pediatric First Aid / CPR / AED"
                                            >Adult &amp; Pediatric First Aid / CPR / AED</option
                                        >
                                        <option value="Adult First Aid / CPR / AED">Adult First Aid / CPR / AED</option>
                                        <option value="Adult CPR / AED">Adult CPR / AED</option>
                                        <option value="First Aid only">First Aid only</option>
                                        <option value="American Red Cross course">American Red Cross course</option>
                                    </select>
                                </label>

                                <template if:true={submitError}>
                                    <p class="error" role="alert">{submitError}</p>
                                </template>

                                <button class="cta" type="submit" disabled={isSubmitting}>{submitLabel}</button>
                            </form>
                        </template>

                        <!-- Seat mode: Salesforce registration (upcoming Enrollware replacement) -->
                        <template if:true={isSeatMode}>
                            <form class="form" onsubmit={handleSubmit}>
                                <label>
                                    <span>First Name</span>
                                    <input type="text" name="firstName" required value={form.firstName} onchange={handleText} />
                                </label>
                                <label>
                                    <span>Last Name</span>
                                    <input type="text" name="lastName" required value={form.lastName} onchange={handleText} />
                                </label>
                                <label>
                                    <span>Email Address</span>
                                    <input type="email" name="email" required value={form.email} onchange={handleText} />
                                </label>
                                <label>
                                    <span>Mobile Phone</span>
                                    <input type="tel" name="phone" required value={form.phone} onchange={handleText} />
                                </label>

                                <fieldset>
                                    <legend>Preferred contact method</legend>
                                    <template for:each={preferredChoices} for:item="opt">
                                        <label key={opt.value} class="choice">
                                            <input
                                                type="radio"
                                                name="preferredContact"
                                                value={opt.value}
                                                checked={opt.checked}
                                                onchange={handleRadio}
                                                required
                                            />
                                            <span>{opt.label}</span>
                                        </label>
                                    </template>
                                </fieldset>

                                <fieldset>
                                    <legend>Select class (AHA / American Red Cross / ECSI inventory)</legend>
                                    <template if:true={loadingOfferings}>
                                        <p class="help">Loading available classes…</p>
                                    </template>
                                    <template if:true={hasOfferings}>
                                        <template for:each={offeringChoices} for:item="opt">
                                            <label key={opt.id} class="choice">
                                                <input
                                                    type="radio"
                                                    name="offeringId"
                                                    value={opt.id}
                                                    checked={opt.checked}
                                                    disabled={opt.disabled}
                                                    onchange={handleRadio}
                                                    required
                                                />
                                                <span>{opt.label}</span>
                                            </label>
                                        </template>
                                    </template>
                                    <template if:false={hasOfferings}>
                                        <template if:false={loadingOfferings}>
                                            <p class="help">No active class seats are listed yet. Please contact us to register.</p>
                                        </template>
                                    </template>
                                </fieldset>

                                <fieldset>
                                    <legend>Delivery option</legend>
                                    <template for:each={deliveryChoices} for:item="opt">
                                        <label key={opt.value} class="choice">
                                            <input
                                                type="radio"
                                                name="deliveryOption"
                                                value={opt.value}
                                                checked={opt.checked}
                                                onchange={handleRadio}
                                                required
                                            />
                                            <span>{opt.label}</span>
                                        </label>
                                    </template>
                                </fieldset>

                                <label>
                                    <span>Preferred class date</span>
                                    <input type="date" name="classDate" required value={form.classDate} onchange={handleText} />
                                </label>
                                <label>
                                    <span>Preferred class time</span>
                                    <select name="classTime" required onchange={handleText}>
                                        <option value="">Select a time</option>
                                        <template for:each={timeChoices} for:item="opt">
                                            <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                                        </template>
                                    </select>
                                </label>

                                <label class="full">
                                    <span>Group / employer / school (or Individual)</span>
                                    <input type="text" name="groupName" required value={form.groupName} onchange={handleText} />
                                </label>

                                <label class="full">
                                    <span>Anything else about your training needs? (Optional)</span>
                                    <textarea
                                        name="trainingNotes"
                                        rows="4"
                                        value={form.trainingNotes}
                                        onchange={handleText}
                                        placeholder="Workplace requirement, renewal, group size, accessibility needs, etc."
                                    ></textarea>
                                </label>

                                <template if:true={submitError}>
                                    <p class="error" role="alert">{submitError}</p>
                                </template>

                                <button class="cta" type="submit" disabled={isSubmitting}>{submitLabel}</button>
                            </form>
                        </template>
                    </template>
                </section>
            </div>
        </section>
    </div>
</template>
