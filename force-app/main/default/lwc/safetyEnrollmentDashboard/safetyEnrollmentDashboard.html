<template>
    <div class="dash">
        <header class="dash-hero">
            <div>
                <div class="eyebrow">ALL CARE PLUS</div>
                <h1>Enrollment Command Center</h1>
                <p>Click any learner to see every answer. Refresh pulls new form submissions. Sync Contacts copies those answers onto the person’s Contact record.</p>
            </div>
            <div class="hero-actions">
                <button class="ghost" type="button" onclick={handleBackfill} disabled={isBusy}>Sync Contacts</button>
                <button class="refresh" type="button" onclick={handleRefresh} disabled={isBusy}>{refreshLabel}</button>
            </div>
        </header>

        <template if:true={error}>
            <div class="error">{error}</div>
        </template>
        <template if:true={statusMessage}>
            <div class="notice">{statusMessage}</div>
        </template>

        <section class="kpi-row">
            <article class="kpi">
                <span>Total Enrollments</span>
                <strong>{total}</strong>
            </article>
            <article class="kpi">
                <span>Contacts Linked</span>
                <strong>{withContact}</strong>
            </article>
            <article class="kpi">
                <span>Avg CPR Confidence</span>
                <strong>{readiness.confidence}</strong>
            </article>
            <article class="kpi">
                <span>Want Self-Care</span>
                <strong>{selfCareYes}</strong>
            </article>
        </section>

        <template if:false={hasData}>
            <section class="empty">No enrollments yet. Submissions from the public form will appear here.</section>
        </template>

        <template if:true={hasData}>
            <section class="summary-row">
                <article class="panel slim">
                    <h2>Readiness averages</h2>
                    <template for:each={readinessCards} for:item="card">
                        <div key={card.key} class="meter">
                            <div class="meter-head">
                                <span>{card.label}</span>
                                <strong>{card.score}</strong>
                            </div>
                            <div class="meter-track"><div class="meter-fill teal" style={card.style}></div></div>
                        </div>
                    </template>
                </article>
                <article class="panel slim">
                    <h2>Prior CPR</h2>
                    <template for:each={byCpr} for:item="row">
                        <div key={row.label} class="meter">
                            <div class="meter-head">
                                <span>{row.label}</span>
                                <strong>{row.value}</strong>
                            </div>
                            <div class="meter-track"><div class="meter-fill blue" style={row.style}></div></div>
                        </div>
                    </template>
                </article>
                <article class="panel slim">
                    <h2>Self-care interest</h2>
                    <template for:each={bySelfCare} for:item="row">
                        <div key={row.label} class="meter">
                            <div class="meter-head">
                                <span>{row.label}</span>
                                <strong>{row.value}</strong>
                            </div>
                            <div class="meter-track"><div class="meter-fill coral" style={row.style}></div></div>
                        </div>
                    </template>
                </article>
                <article class="panel slim">
                    <h2>Agencies</h2>
                    <template for:each={byAgency} for:item="row">
                        <div key={row.label} class="meter">
                            <div class="meter-head">
                                <span>{row.label}</span>
                                <strong>{row.value}</strong>
                            </div>
                            <div class="meter-track"><div class="meter-fill teal" style={row.style}></div></div>
                        </div>
                    </template>
                </article>
            </section>

            <section class="workspace">
                <aside class="roster panel">
                    <div class="roster-head">
                        <h2>Learners</h2>
                        <input
                            class="search"
                            type="search"
                            placeholder="Search name, email, group…"
                            value={searchTerm}
                            oninput={handleSearch}
                        />
                    </div>
                    <div class="learner-list">
                        <template for:each={filteredLearners} for:item="row">
                            <button
                                key={row.Id}
                                class={row.cardClass}
                                type="button"
                                data-id={row.Id}
                                onclick={handleSelect}
                            >
                                <span class="avatar">{row.initials}</span>
                                <span class="learner-body">
                                    <strong>{row.fullName}</strong>
                                    <span class="subtle">{row.Email__c}</span>
                                    <span class="chip-row">
                                        <span class="chip">{row.cprChip}</span>
                                        <span class="chip coral">{row.selfCareChip}</span>
                                    </span>
                                </span>
                                <span class="learner-meta">
                                    <span class="confidence">{row.confidenceLabel}</span>
                                    <span class="subtle">{row.submitted}</span>
                                </span>
                            </button>
                        </template>
                    </div>
                </aside>

                <article class="detail panel">
                    <template if:false={hasSelection}>
                        <div class="empty-detail">Select a learner to view their full responses.</div>
                    </template>

                    <template if:true={hasSelection}>
                        <div class="detail-hero">
                            <div class="detail-identity">
                                <span class="avatar xl">{selected.initials}</span>
                                <div>
                                    <div class="eyebrow">Full response profile</div>
                                    <h2>{selected.fullName}</h2>
                                    <p>
                                        {selected.classLabel}
                                        <template if:true={selected.Profession__c}>
                                            · {selected.Profession__c}
                                        </template>
                                    </p>
                                    <div class="chip-row">
                                        <span class="chip">{selected.cprChip}</span>
                                        <span class="chip coral">{selected.selfCareChip}</span>
                                        <template if:true={selected.hasContact}>
                                            <span class="chip teal">Contact linked</span>
                                        </template>
                                    </div>
                                </div>
                            </div>
                            <div class="detail-actions">
                                <template if:true={selected.hasContact}>
                                    <button class="refresh" type="button" onclick={openContact}>Open Contact</button>
                                </template>
                                <button class="ghost" type="button" onclick={openEnrollment}>Open enrollment record</button>
                            </div>
                        </div>

                        <div class="scoreboard">
                            <h3>Rescuer readiness scores</h3>
                            <div class="score-grid">
                                <template for:each={selectedScores} for:item="score">
                                    <div key={score.key} class="score-card">
                                        <span>{score.label}</span>
                                        <strong>{score.display}</strong>
                                        <div class="meter-track"><div class="meter-fill teal" style={score.style}></div></div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="sections">
                            <template for:each={detailSections} for:item="section">
                                <section key={section.key} class="response-block">
                                    <h3 class={section.tone}>{section.title}</h3>
                                    <div class="answer-grid">
                                        <template for:each={section.items} for:item="item">
                                            <div key={item.label} class="answer">
                                                <span>{item.label}</span>
                                                <strong>{item.value}</strong>
                                            </div>
                                        </template>
                                    </div>
                                </section>
                            </template>
                        </div>
                    </template>
                </article>
            </section>
        </template>
    </div>
</template>
