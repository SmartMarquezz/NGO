<template>
    <div class="layout">
        <aside class="visual" aria-hidden="true">
            <img src={sideImage} alt="" />
            <div class="visual-shade"></div>
            <div class="visual-copy">
                <p class="eyebrow">ACCEPT &amp; GROW</p>
                <h2>Quick signup. We’ll follow up fast.</h2>
                <p>Name, contact, and what you need — that’s enough to get started.</p>
            </div>
        </aside>

        <section class="form-shell" id="signup" data-register>
            <header class="intro">
                <h2>{introTitle}</h2>
                <p>
                    Short pre-qual so we can place you in the right path. Crisis support: call/text
                    <strong>988</strong>.
                </p>
            </header>

            <template if:true={isComplete}>
                <div class="success" role="status">
                    Thank you — we’ve received your Accept &amp; Grow signup. Our team will follow up within 24–48 hours
                    with next steps.
                </div>
            </template>

            <template if:false={isComplete}>
                <form class="form" onsubmit={handleSubmit}>
                    <fieldset>
                        <legend>What do you want to sign up for?</legend>
                        <template for:each={interestChoices} for:item="opt">
                            <label key={opt.value} class="choice">
                                <input
                                    type="radio"
                                    name="interestPath"
                                    value={opt.value}
                                    checked={opt.checked}
                                    onchange={handleRadio}
                                    required
                                />
                                <span>{opt.label}</span>
                            </label>
                        </template>
                    </fieldset>

                    <label>
                        <span>Full name</span>
                        <input type="text" name="participantName" required value={participantName} onchange={handleText} />
                    </label>
                    <label>
                        <span>Email</span>
                        <input type="email" name="email" required value={email} onchange={handleText} />
                    </label>
                    <label>
                        <span>Mobile phone</span>
                        <input type="tel" name="phone" required value={phone} onchange={handleText} />
                    </label>

                    <fieldset>
                        <legend>How soon?</legend>
                        <template for:each={urgencyChoices} for:item="opt">
                            <label key={opt.value} class="choice">
                                <input
                                    type="radio"
                                    name="urgency"
                                    value={opt.value}
                                    checked={opt.checked}
                                    onchange={handleRadio}
                                    required
                                />
                                <span>{opt.label}</span>
                            </label>
                        </template>
                    </fieldset>

                    <label class="full">
                        <span>Anything we should know? (optional)</span>
                        <textarea name="notes" rows="3" value={notes} onchange={handleText}></textarea>
                    </label>

                    <label class="choice full">
                        <input type="checkbox" checked={emergencyChecked} onchange={handleEmergency} required />
                        <span
                            >I understand Accept &amp; Grow is not 24/7 crisis care. If someone is in immediate danger,
                            call/text 988 or 911.</span
                        >
                    </label>

                    <template if:true={errorMessage}>
                        <p class="error" role="alert">{errorMessage}</p>
                    </template>

                    <button class="cta" type="submit" disabled={isSubmitting}>{submitLabel}</button>
                </form>
            </template>
        </section>
    </div>
</template>
